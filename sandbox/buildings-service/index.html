<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URBIS · service model gallery</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2230; font-family: Inter, system-ui, sans-serif; }
      #ui { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70vw; }
      #ui button, #ui select { background: rgba(20, 26, 36, 0.82); color: #e8eef5; border: 1px solid #3b4a5e; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
      #stats { position: fixed; bottom: 8px; left: 10px; color: #cfe0f0; font: 11px/1.3 monospace; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; }
      .lbl { color: #fff; font: 600 11px/1.1 Inter, system-ui, sans-serif; background: rgba(12, 18, 28, 0.72); padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 1px #000; }
      .lbl small { font-weight: 400; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="stats"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
